models:
  - type: main
    engine: openai
    # 2026-10-23 HOTFIX: was gpt-4.1-nano, shut down by OpenAI today - see
    # guardrails_input.py's own DEFAULT_GUARDRAILS_MODEL comment.
    model: gpt-4.1-mini

rails:
  input:
    flows:
      - self check input
      - mask sensitive data on input
  output:
    flows:
      - self check output
      - mask sensitive data on output

  config:
    sensitive_data_detection:
      input:
        entities:
          - PERSON
          - EMAIL_ADDRESS
          - US_SSN
          - CREDIT_CARD
      output:
        entities:
          - PERSON
          - EMAIL_ADDRESS
          - US_SSN
          - CREDIT_CARD
